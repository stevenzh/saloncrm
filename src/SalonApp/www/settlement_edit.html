    <script src="scripts/jquery-2.1.1.min.js"></script>
    <script type="text/javascript" charset="utf-8" src="cordova.js"></script>
    <script src="scripts/config.js"></script>
    <script src="scripts/jquery.mobile-1.4.5.min.js"></script>
    <script src="scripts/jquery.mobile.toast.min.js"></script>
    <script src="scripts/jquery.validate.min.js"></script>
    <script src="scripts/jquery.mobile.paramsHandler-1.4.3.js"></script>
    <script src="scripts/fastclick.js"></script>
    <script type="text/javascript">
        if (platform == "cordova")
            $.when(deviceReadyDeferred, jqmReadyDeferred).done(doInit);
        else
            $.when(jqmReadyDeferred).done(doInit);

        function doInit() {
            console.log("doInit");
            FastClick.attach(document.body);
            commonInit();

            // 美容顾问
            $.ajax({
                type: "POST",
                dataType: "json",
                data: { "hostId": userObject.host, "branchId": userObject.branch, "type": "3" },
                url: serverUrl + "/UsersAdmin/AppListWorkers",
                success: function (result) {
                    $.each(result, function (i, item) {
                        $("#inputSales").append('<option value="' + item.Text + '">' + item.Value + '</option>');
                    });
                },
                error: function (XMLHttpRequest, textStatus, errorThrown) {
                    showNetErrMsg();
                }
            });

            // 美容师
            $.ajax({
                type: "POST",
                dataType: "json",
                data: { "hostId": userObject.host, "branchId": userObject.branch, "type": "0" },
                url: serverUrl + "/UsersAdmin/AppListWorkers",
                success: function (result) {
                    $.each(result, function (i, item) {
                        $("#inputWorkers").append('<label for="wo' + item.Text + '">' + item.Value + '</label><input type="checkbox" id="wo' + item.Text + '" name="worker" value="' + item.Text + '">');
                        $("#inputWorkers1").append('<label for="wk' + item.Text + '">' + item.Value + '</label><input type="checkbox" id="wk' + item.Text + '" name="worker1" value="' + item.Text + '">');
                        $("#inputWorkers2").append('<label for="wh' + item.Text + '">' + item.Value + '</label><input type="checkbox" id="wh' + item.Text + '" name="worker2" value="' + item.Text + '">');
                    });
                },
                error: function (XMLHttpRequest, textStatus, errorThrown) {
                    // This callback function will trigger on unsuccessful action
                    showNetErrMsg();
                }
            });

            // 项目分类
            $.ajax({
                type: "POST",
                dataType: "json",
                data: { "hostId": userObject.host, "branchId": userObject.branch },
                url: serverUrl + "/Project/AppCategory",
                success: function (data) {
                    $(data).each(function (i) {
                        var option = "<option value=\"" + data[i].code + "\">" + data[i].name + "</option>";
                        $("#inputCategory").append(option);
                    });
                },
                error: function (XMLHttpRequest, textStatus, errorThrown) {
                    // This callback function will trigger on unsuccessful action
                    showNetErrMsg();
                }
            });

            // 取得订单信息
            current_bid = getUrlParameter("id");
            var memberId = getUrlParameter("mid");
            console.log("bookid:" + current_bid + ", memberId:" + memberId);
            $.ajax({
                type: "POST",
                dataType: "json",
                data: { "hostId": userObject.host, "branchId": userObject.branch, BookId: current_bid },
                url: serverUrl + "/Book/AppBookInfo",
                success: function (data) {
                    $.each(data.projects, function (i, item) {
                        var bbb = "";
                        $.each(item.Beauties, function (j, bb) {
                            bbb = bbb + bb + ",";
                        });
                        var kk = (item.Type == "0" ? "false" : "true");
                        //[项目ID, [卡扣：false，现付：true]，数量，[美容师]，金额, MemberProjectId, MemberCardId, BookProjectId, IsEntity, ProjectCategory, PaymentType]
                        var plt = [item.ProjectId, kk, item.Quantity, bbb, item.Amount, item.MemberProjectId, item.MemberCardId + ":" + item.MemberCardType, item.BookProjectId, item.IsEntity, item.Catetory, item.Type];
                        book_list.push(plt);

                        // 显示列表
                        if (item.MemberProjectId == null) {
                            if (item.MemberCardType == "4" || item.MemberCardType == "5" || item.MemberCardType == "8")
                                $("#ul_project").append('<li id="dpi' + book_list.length + '" pid="pi' + item.ProjectId + '"><a href="#page7?&pid=' + item.ProjectId + '&dpid=' + book_list.length + '"><h2>' + item.ProjectName + '</h2><p></p><span class="ui-li-count">￥' + item.Amount + '</span></a></li>');
                            else
                                $("#ul_project").append('<li id="dpi' + book_list.length + '" pid="pi' + item.ProjectId + '"><a href="#page4?&pid=' + item.ProjectId + '&dpid=' + book_list.length + '"><h2>' + item.ProjectName + '</h2><p></p><span class="ui-li-count">￥' + item.Amount + '</span></a></li>');
                        }
                    });

                    $('#ul_project').listview('refresh');

                    // 自动设置顾问
                    if (data.book.SalesmanID != "") {
                        $("#inputSales").val(data.book.SalesmanID);
                        $("#inputSales").selectmenu("refresh");
                    }
                },
                error: function (request, error) {
                    // This callback function will trigger on unsuccessful action
                    showNetErrMsg();
                }
            });

            // 取得顾客信息
            $.ajax({
                type: "POST",
                dataType: "json",
                data: { "hostId": userObject.host, "branchId": userObject.branch, cardNo: memberId },
                url: serverUrl + "/MemberAdmin/AppMemberInfo",
                success: function (data) {
                    $("#ul_member").empty();
                    memberObject.MemberID = data.MemberID;
                    memberObject.Amt = data.Amt;
                    memberObject.CardNo = data.CardNo;
                    $("#ul_member").append("<li>姓名：" + data.Name + "</li><li>手机：" + data.MobileNumber + "</li><li>余额：" + data.Amt + "</li><li>等级：" + data.LevelValue + "</li><li>状态：" + data.StatusValue + "</li>");
                    $("#ul_member").listview('refresh');
                    //$("#ul_project").empty();
                    $.each(data.Projects, function (i, item) {
                        if (item.IsEntity == '0') {   // 不显示即销即耗
                            var pjn = item.ProjectName;
                            if (item.Type == "1") {
                                pjn = item.ProjectName + "[赠]"
                            } else if (item.Type == "1") {
                                pjn = item.ProjectName + "[转]"
                            }
                            if (item.CardType == "1") {
                                pjn = item.ProjectName + "[疗]"
                            } else if (item.CardType == "3") {
                                pjn = item.ProjectName + "[体]"
                            } else if (item.CardType == "4" || item.CardType == "5") {
                                pjn = item.ProjectName + "[综]"
                            } else if (item.CardType == "7") {
                                pjn = item.ProjectName + "[拓]"
                            }

                            // 和订单比较，对应项目标记消费次数
                            var nohas = true;
                            var llstr = "";
                            for (var i = 0; i < book_list.length; i++) {
                                //console.log("book_list[i][5]:" + book_list[i][5]);
                                //console.log("item.MemberProjectId" + item.MemberProjectId);

                                if (book_list[i][5] == item.MemberProjectId) {
                                    nohas = false;
                                    llstr = '<li id="pi' + item.MemberProjectId + '" pid="pi' + item.ProjectID + '" pcount="' + item.LastCount + '" pentity="' + book_list[i][8] + '"><a href="#page3?mpid=' + item.MemberProjectId + '&pid=' + item.ProjectID + '"><h2>' + pjn + '</h2><p>可用次数：' + item.LastCount + '</p><span class="ui-li-count">' + book_list[i][2] + '</span></a></li>'
                                }
                            }

                            if (nohas == false) {
                                console.log("book project, MemberProject:" + pjn);
                                $("#ul_project").append(llstr);
                            } else {
                                // 购买项目列表
                                $("#ul_project").append('<li id="pi' + item.MemberProjectId + '" pid="pi' + item.ProjectID + '" pcount="' + item.LastCount + ' pentity="' + item.IsEntity + '"><a href="#page3?mpid=' + item.MemberProjectId + '&pid=' + item.ProjectID + '"><h2>' + pjn + '</h2><p>可用次数：' + item.LastCount + '</p><span class="ui-li-count">0</span></a></li>');
                            }

                            project_list.push([item.MemberProjectId, item.CardType, item.MemberCardId, item.ProjectID, item.Type, item.LastCount, item.UnitPrice]);
                        }
                    });
                    $('#ul_project').listview('refresh');

                    // 客户卡
                    // 卡片类型 0:储值卡 1: 疗程卡 2: 单次卡 3: 体验卡 4: 综合限时卡 5: 综合限次卡 6: 拓客增值卡 7: 拓客优惠卡 8: 综合限时限次卡
                    $(data.Cards).each(function (i, item) {
                        if (item.Type == '0' || item.Type == '6') {
                            var option = "<option value='" + item.MemberCardId + ":" + item.Type + "' data-amt='" + item.Amt + "'>" + item.TypeValue + (item.Title == null ? "" : (":" + item.Title)) + ":" + item.Amt + "元</option>";
                            $("#inputCard").append(option);
                        }
                        if (item.Type == '4') {
                            var option = "<option value=\"" + item.MemberCardId + ":" + item.Type + "\">" + item.TypeValue + (item.Title == null ? "" : (":" + item.Title)) + ":时限" + getDate(item.ExpiryDate) + "</option>";
                            $("#inputCard2").append(option);
                        }
                        if (item.Type == '5') {
                            var option = "<option value=\"" + item.MemberCardId + ":" + item.Type + "\" data-num='" + item.LastCount + "'>" + item.TypeValue + (item.Title == null ? "" : (":" + item.Title)) + ":" + item.LastCount + "次</option>";
                            $("#inputCard2").append(option);
                        }
                        if (item.Type == '8') {
                            var option = "<option value=\"" + item.MemberCardId + ":" + item.Type + "\" data-num='" + item.LastCount + "'>" + item.TypeValue + (item.Title == null ? "" : (":" + item.Title)) + ":" + item.LastCount + "次,时限" + getDate(item.ExpiryDate) + "</option>";
                            $("#inputCard2").append(option);
                        }
                    });

                    //$.mobile.changePage("#page2");
                },
                error: function (request, error) {
                    // This callback function will trigger on unsuccessful action
                    showNetErrMsg();
                }
            });

            // 跳转到设置份数服务页面
            $.mobile.paramsHandler.addPage("page3", ["mpid", "pid"], [], function (args) {
                current_pid = args.pid;
                current_mpid = args.mpid;

                // 取得项目数量，限制选择份数 未完成
                var pcount = $("#pi" + current_mpid).attr("pcount");

                // 复位操作
                $('input[name="radio-h-2"]:checked').each(function () {
                    $(this).prop("checked", false).checkboxradio("refresh");
                });
                $('input[name="worker"]:checked').each(function () {
                    $(this).prop("checked", false).checkboxradio("refresh");
                });

                for (var i = 0; i < project_list.length; i++) {
                    if (project_list[i][0] == current_mpid) {
                        if (project_list[i][4] == "1") {   // 赠与项目
                            $("#divAmt").show();
                        } else {
                            $("#divAmt").hide();
                        }
                    }
                }

                //数组回写到页面
                for (var i = 0; i < book_list.length; i++) {
                    if (book_list[i][5] == current_mpid) {

                        // 设置份数
                        if (book_list[i][2] != "") {
                            if (page3Init == false) {
                                $('input[name="radio-h-2"][value="' + book_list[i][2] + '"]').prop("checked", true);
                            } else {
                                $('input[name="radio-h-2"][value="' + book_list[i][2] + '"]').prop("checked", true).checkboxradio("refresh");
                            }
                        }
                        // 设置美容师
                        var wk = book_list[i][3].split(',');
                        for (var j = 0; j < wk.length; j++) {
                            if (wk[j] != "")
                                if (page3Init == false) {
                                    $("#wo" + wk[j]).prop("checked", true);
                                } else {
                                    $("#wo" + wk[j]).prop("checked", true).checkboxradio("refresh");
                                }
                        }
                        // 金额
                        $("#inputAmt").val(book_list[i][4]);
                    }
                }
                page3Init = true;

                $("#page3 div h1").text($("#pi" + args.pid + " a h2").text());
            });

            // 跳转到现金消费页面
            $.mobile.paramsHandler.addPage("page4", ["pid", "dpid"], [], function (args) {
                current_pid = args.pid;
                current_dpid = args.dpid;

                // 复位操作
                $('input[name="radio-h-3"]:checked').each(function () {
                    $(this).prop("checked", false).checkboxradio("refresh");
                });
                $('input[name="worker1"]:checked').each(function () {
                    $(this).prop("checked", false).checkboxradio("refresh");
                });
